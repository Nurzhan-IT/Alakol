name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Тестирование
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies  
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/test.txt
    
    - name: Create logs directory
      run: mkdir -p logs
    
    - name: Collect static files for tests
      env:
        SECRET_KEY: test-secret-key-for-ci
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/1
      run: |
        python manage.py collectstatic --noinput --settings=hms_prj.test_settings
    
    - name: Run Django checks
      env:
        SECRET_KEY: test-secret-key-for-ci
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/1
      run: |
        python manage.py check --settings=hms_prj.test_settings
    
    - name: Run tests
      env:
        SECRET_KEY: test-secret-key-for-ci
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/1
      run: |
        python manage.py test --settings=hms_prj.test_settings --verbosity=2

  deploy:
    name: Деплой в продакшн
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Verify SSH connection prerequisites
      run: |
        echo "🔍 Проверяем SSH подключение..."
        if [ -z "${{ secrets.HOST }}" ]; then
          echo "❌ Секрет HOST не настроен!"
          exit 1
        fi
        if [ -z "${{ secrets.SSH_USER }}" ]; then
          echo "❌ Секрет SSH_USER не настроен!"
          exit 1
        fi
        echo "✅ SSH секреты настроены"
        echo "🎯 Подключаемся к хосту: ${{ secrets.HOST }}"
    
    - name: Add server to known hosts
      run: |
        echo "🔑 Добавляем сервер в known_hosts..."
        # Создаем директорию ~/.ssh если её нет
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Пробуем получить ключ хоста с таймаутом
        if timeout 30 ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts; then
          echo "✅ Ключ хоста успешно добавлен"
        else
          echo "❌ Не удалось получить ключ хоста"
          echo "🔍 Проверяем доступность хоста..."
          if timeout 10 nc -z ${{ secrets.HOST }} 22; then
            echo "✅ Порт 22 доступен"
            echo "⚠️  Попробуем добавить ключ хоста без проверки..."
            # Альтернативный способ - отключаем проверку ключа хоста
            echo "StrictHostKeyChecking no" >> ~/.ssh/config
            echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
            chmod 600 ~/.ssh/config
          else
            echo "❌ Хост недоступен на порту 22"
            echo "🔍 Пробуем ping хоста..."
            if timeout 10 ping -c 3 ${{ secrets.HOST }}; then
              echo "✅ Хост отвечает на ping"
            else
              echo "❌ Хост не отвечает на ping"
            fi
            exit 1
          fi
        fi
    
    - name: Debug SSH authentication
      run: |
        echo "🔍 Диагностика SSH аутентификации..."
        
        # Проверим что SSH agent работает
        if [ -n "$SSH_AUTH_SOCK" ]; then
          echo "✅ SSH agent активен"
          echo "🔑 Загруженные ключи:"
          ssh-add -l || echo "❌ Нет загруженных ключей"
        else
          echo "❌ SSH agent не активен"
        fi
        
        # Попробуем подключиться с детальными логами
        echo "🔧 Тестируем SSH подключение с детальными логами..."
        ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes ${{ secrets.SSH_USER }}@${{ secrets.HOST }} "echo 'SSH connection test successful'" 2>&1 | head -30 || echo "❌ SSH подключение не удалось"
        
        # Проверим формат ключа
        echo "🔍 Проверяем формат SSH ключа..."
        if ssh-keygen -l -f /dev/stdin <<< "${{ secrets.SSH_PRIVATE_KEY }}" 2>/dev/null; then
          echo "✅ SSH ключ имеет правильный формат"
        else
          echo "❌ SSH ключ имеет неправильный формат"
        fi
    
    - name: Deploy to server
      run: |
        echo "🚀 Начинаем деплой..."
        
        ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 ${{ secrets.SSH_USER }}@${{ secrets.HOST }} << 'EOF'
          set -e
          
          echo "🚀 Начинаем деплой Alakol HMS..."
          
          # Переходим в директорию проекта
          cd ${{ secrets.DEPLOY_PATH }}
          
          # Создаем резервную копию текущей версии
          echo "📦 Создаем резервную копию..."
          cp docker-compose.prod.yml docker-compose.backup.yml || true
          
          # Обновляем код
          echo "📥 Обновляем код..."
          git fetch origin
          git pull origin main
          
          # Проверяем что все необходимые файлы на месте
          if [ ! -f ".env.prod" ]; then
            echo "❌ Файл .env.prod не найден!"
            exit 1
          fi
          
          # Создаем директории если их нет
          mkdir -p logs backups
          
          # Останавливаем текущие контейнеры
          echo "🔄 Останавливаем текущие контейнеры..."
          docker-compose -f docker-compose.prod.yml down || true
          
          # Очищаем старые образы
          echo "🧹 Очищаем старые образы..."
          docker system prune -f
          
          # Собираем новые образы
          echo "🔨 Собираем новые образы..."
          docker-compose -f docker-compose.prod.yml build --no-cache
          
          # Запускаем сервисы
          echo "🚀 Запускаем сервисы..."
          docker-compose -f docker-compose.prod.yml up -d
          
          # Ждем запуска
          echo "⏳ Ждем запуска сервисов..."
          sleep 60
          
          # Проверяем работоспособность
          echo "🏥 Проверяем работоспособность..."
          
          # Проверяем что контейнеры работают
          if ! docker-compose -f docker-compose.prod.yml ps | grep -q "Up"; then
            echo "❌ Контейнеры не запустились!"
            echo "Логи:"
            docker-compose -f docker-compose.prod.yml logs --tail=50
            exit 1
          fi
          
          # Проверяем health check
          if ! curl -f http://localhost:8000/health/ > /dev/null 2>&1; then
            echo "❌ Health check не прошел!"
            echo "Логи web сервиса:"
            docker-compose -f docker-compose.prod.yml logs web --tail=50
            
            # Откатываем изменения
            echo "🔄 Откатываем изменения..."
            docker-compose -f docker-compose.prod.yml down
            if [ -f "docker-compose.backup.yml" ]; then
              mv docker-compose.backup.yml docker-compose.prod.yml
              docker-compose -f docker-compose.prod.yml up -d
            fi
            exit 1
          fi
          
          # Успешное завершение
          echo "✅ Деплой завершен успешно!"
          echo "🌐 Сайт доступен по адресу: https://${{ secrets.DOMAIN_NAME }}"
          
          # Показываем статус сервисов
          echo "📊 Статус сервисов:"
          docker-compose -f docker-compose.prod.yml ps
          
          # Удаляем резервную копию
          rm -f docker-compose.backup.yml
          
        EOF
    
    - name: Notify deployment result - Success
      if: success()
      run: |
        echo "✅ Деплой успешно завершен!"
    
    - name: Notify deployment result - Failure
      if: failure()
      run: |
        echo "❌ Деплой завершился с ошибкой!"
        echo "🔍 Проверьте:"
        echo "1. Настройки SSH секретов (HOST, SSH_USER, SSH_PRIVATE_KEY)"
        echo "2. Доступность сервера"
        echo "3. Правильность конфигурации на сервере" 