    <script>
        // Messages загружаются динамически через AJAX для предотвращения кэширования

        function loadAndDisplayMessages() {
            $.ajax({
                url: '{% url "hotel:get_messages" %}',
                type: 'GET',
                success: function(data) {
                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(function(message) {
                            Swal.fire({
                                icon: message.level_tag,
                                title: message.message,
                                text: message.level_tag,
                                timer: 15000
                            });
                        });
                    }
                },
                error: function() {
                    // Тихо игнорируем ошибки загрузки messages
                    console.log('Messages loading failed silently');
                }
            });
        }
        
        // Загружаем messages при загрузке страницы
        $(document).ready(function() {
            loadAndDisplayMessages();
        });
    </script>

    {% block script_links %}

    <script>
        $(function() {

            var start = moment().subtract(0, 'days');
            var end = moment().add(2, 'days');

            function cb(start, end) {
                $('#booking-date-search').html(start.format('MMMM D, YYYY') + ' - ' + end.format('MMMM D, YYYY'));
            }
            cb(start, end);
            $('#booking-date-search').daterangepicker({
                "opens": "right",
                "autoUpdateInput": true,
                "alwaysShowCalendars": true,
                startDate: start,
                endDate: end
            }, cb);

            cb(start, end);

        });

        // Calendar animation and visual settings
        $('#booking-date-search').on('show.daterangepicker', function(ev, picker) {
            $('.daterangepicker').addClass('calendar-visible calendar-animated bordered-style');
            $('.daterangepicker').removeClass('calendar-hidden');
        });
        $('#booking-date-search').on('hide.daterangepicker', function(ev, picker) {
            $('.daterangepicker').removeClass('calendar-visible');
            $('.daterangepicker').addClass('calendar-hidden');
        });

        $(window).on('load', function() {
            $('#booking-date-search').val('');
        });

    
    </script>
